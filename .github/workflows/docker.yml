name: Docker
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - release-*
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Allow manual runs only on master and release branches
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ${GITHUB_REF} != "refs/heads/master" && ${GITHUB_REF} != refs/heads/release-* ]]; then
            echo "::error::Manual runs are only allowed on master or a release-* branch, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the version
        id: get_version
        run: |
          tag=${GITHUB_REF#refs/tags/}
          VERSION=${tag#"v"}
          if [[ ${GITHUB_REF} == "refs/heads/master" ]]; then
            VERSION=latest
          fi
          if [[ ${GITHUB_EVENT_NAME} == "workflow_dispatch" && ${GITHUB_REF} == refs/heads/release-* ]]; then
            VERSION=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)
          fi
          if [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            VERSION=pr-${{ github.event.pull_request.number }}
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Get git revision
        id: vars
        shell: bash
        run: |
          echo "git_revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login docker.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each platform's image must run its own binaries: an arm64 image with x86-64 ones was published
      # before (docker-terraform N5). Build each platform, then run the tools in it.
      - name: Smoke test each platform
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --load -t "smoke:${arch}" .
            docker run --rm --platform "linux/${arch}" -e ARCH="${arch}" --entrypoint sh "smoke:${arch}" -euc '
              v="$(terraform version)"; echo "$v"
              echo "$v" | grep -q "^OpenTofu v"
              echo "$v" | grep -qx "on linux_${ARCH}"
              ls /root/.terraform.d/plugins/registry.opentofu.org/hashicorp/random/*/"linux_${ARCH}"/terraform-provider-random_*
              git --version
              ssh -V
              jq --version
              az version --output none
            '
          done

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        name: Build & Pushing image for Dockerhub
        with:
          context: .
          file: Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GITVERSION=git-${{ steps.vars.outputs.git_revision }}
            VERSION=${{ steps.get_version.outputs.VERSION }}
            GOPROXY=https://proxy.golang.org
          tags: |-
            docker.io/oamdev/docker-terraform:${{ steps.get_version.outputs.VERSION }}
